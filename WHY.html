function readText(f) { return f.arrayBuffer().then(function (buf) { var u = new Uint8Array(buf), enc = 'utf-8'; if (u[0] === 0xFF && u[1] === 0xFE) enc = 'utf-16le'; else if (u[0] === 0xFE && u[1] === 0xFF) enc = 'utf-16be'; else if (u.length > 4 && u[1] === 0 && u[3] === 0) enc = 'utf-16le'; return new TextDecoder(enc).decode(buf); }); }

    '<p class="hint">Impor ulang berkas yang tumpang tindih aman: deal dengan ID yang sama dilewati.</p><div class="row"><button class="btn solid" data-a="imp-go"' + (nd ? '' : ' disabled') + '>Impor ' + nd + ' baris</button></div></div></div>';
}
function doImport() {
  var I = V.imp, deals = [], pos = [], fn = [];
  I.files.forEach(function (f) { deals = deals.concat(f.res.deals); pos = pos.concat(f.res.positions); fn.push({ name: f.name, at: Date.now(), deals: f.res.deals.length, pos: f.res.positions.length }); });
  var a, added = 0, skipped = 0;
  if (I.target === 'new') {
    if (!deals.length && !pos.length) return;
    a = { id: 'a' + Date.now().toString(36), name: I.name.trim() || 'Akun MT5 ' + (S.accounts.length + 1), platform: 'MetaTrader 5', broker: I.broker.trim(), currency: (I.currency || 'USD').trim().toUpperCase(), mode: I.mode, isDemo: false, files: [], deals: [], positions: [], createdAt: Date.now() };
    S.accounts.push(a);
  } else a = S.accounts.filter(function (x) { return x.id === I.target; })[0];
  var seen = {}; a.deals.forEach(function (d) { seen[dealKey(d)] = 1; });
  deals.forEach(function (d) { var k = dealKey(d); if (seen[k]) skipped++; else { seen[k] = 1; a.deals.push(d); added++; } });
  var ps = {}; (a.positions || []).forEach(function (p) { ps[p.id + '|' + p.entryT] = 1; }); a.positions = a.positions || [];
  pos.forEach(function (p) { var k = p.id + '|' + p.entryT; if (ps[k]) skipped++; else { ps[k] = 1; a.positions.push(p); added++; } });
  a.files = (a.files || []).concat(fn); a.updatedAt = Date.now();
  logA('Impor ' + fn.map(function (f) { return f.name; }).join(', ') + ' ke ' + a.name + ': ' + added + ' baru, ' + skipped + ' duplikat dilewati');
  if (I.target === 'new') S.active = a.id; cache = {}; V.imp = null; save(); paintImport(); toast('Impor selesai: ' + added + ' baris baru, ' + skipped + ' duplikat dilewati'); render();
}

}
function gotoTradesWith(ids, label) { V.tf = { sym: '', side: '', res: '', flag: '', q: '', ids: ids, idsLabel: label }; V.page = 0; V.dj = 'trade'; V.drawer = null; paintDrawer(); if (route() !== 'deep-jurnal') location.hash = '#deep-jurnal'; else render(); window.scrollTo(0, 0); }
function downloadNote(text) { var n = $('#exp-note'); if (n) n.textContent = text; }
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-a]'); if (!t) return; var a = t.dataset.a, r;
  if ((a === 'drawer-bg' || a === 'imp-bg') && e.target !== t) return;

    case 'export': downloadNote('Penampil ini tidak mengizinkan unduhan berkas. Salin teks di kotak bawah dan simpan sebagai why-data.json.'); var ta = $('#exp-note'); if (ta && !$('#exp-ta')) ta.insertAdjacentHTML('afterend', '<label class="f" for="exp-ta">Data (JSON)<textarea id="exp-ta" readonly rows="6" style="width:100%;border:0;border-radius:14px;padding:12px;background:var(--grad-in);box-shadow:var(--inset-s);color:var(--tx);font:12px var(--f-mono)"></textarea></label>'); var te = $('#exp-ta'); if (te) te.value = JSON.stringify(S); break;
    case 'csv': r = A(); var ts = tradeFilter(r), rows = [['id', 'akun', 'symbol', 'arah', 'lot', 'entry_time', 'entry', 'exit_time', 'exit', 'gross', 'komisi', 'swap', 'fee', 'net', 'durasi_menit', 'kualitas', 'flag']].concat(ts.map(function (x) { return [x.id, x.acctName, x.symbol, x.side, x.entryVol, fT(x.entryT), x.entryPrice, fT(x.exitT), x.exitPrice, x.gross, x.comm, x.swap, x.fee, x.net, x.holdMin, x.quality, x.flags.join('; ')]; }));

  }
});
document.addEventListener('change', function (e) {
